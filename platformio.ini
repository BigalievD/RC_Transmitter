[env:Waveshare]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-p4
framework = arduino
monitor_speed = 115200
monitor_echo = yes
board_build.partitions = partitions.csv
;upload_protocol = espota
;upload_port =172.20.10.3

build_flags =
    -DARDUINO_LOOP_STACK_SIZE=16384
    -I include
    -I src
    -DLV_CONF_INCLUDE_SIMPLE
    -D BOARD_HAS_PSRAM
    -I .pio/libdeps/Waveshare/lvgl/src
    -D CONFIG_ESP_LCD_TOUCH_MAX_POINTS=5
    -D CONFIG_ESP_LCD_TOUCH_MAX_BUTTONS=1
    -D CONFIG_ESP_COREDUMP_ENABLE_TO_NONE=1
    -DCORE_DEBUG_LEVEL=1  ; Оставит только критические ошибки (Error)

lib_deps =
    lvgl/lvgl @ ^9.5.0

lib_extra_dirs = lib
